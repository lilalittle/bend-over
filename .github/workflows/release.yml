name: Bend packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BEND_NO_TELEMETRY: "1"
  BEND_LIB: ${{ github.workspace }}/.cache/bend
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev
      - run: bun install --frozen-lockfile
      - run: bun run toolchain:install
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run release:check
      - if: runner.os == 'Linux'
        run: bun run test:sqlite:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-check-${{ matrix.os }}
          path: |
            .cache/releases/
            test-results/
          if-no-files-found: ignore

  publish:
    name: Publish verified packages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: bendhub-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y clang libsqlite3-dev
      - run: bun install --frozen-lockfile
      - run: bun run toolchain:install
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Restore Bend login
        env:
          BEND_BENDER_JSON: ${{ secrets.BEND_BENDER_JSON }}
        run: |
          bun -e '
            import {mkdir,writeFile} from "node:fs/promises";
            import {homedir} from "node:os";
            const raw=process.env.BEND_BENDER_JSON;
            if(!raw)throw new Error("Configure the BEND_BENDER_JSON Actions secret after bend login");
            const login=JSON.parse(raw);
            if(typeof login.key!=="string"||!login.key)throw new Error("Invalid Bend login secret");
            await mkdir(homedir()+"/.bend",{recursive:true});
            await writeFile(homedir()+"/.bend/bender.json",JSON.stringify(login)+"\n",{mode:0o600});
          '
      - run: bun run release:publish
      - name: Remove publishing credentials
        if: always()
        run: rm -f "$HOME/.bend/bender.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: publication-receipts
          path: .cache/releases/
          if-no-files-found: ignore
